<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenPoints</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🌱 GreenPoints</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="login-page">
    <div class="login-card">
        <div class="login-illustration" aria-hidden="true">
            <div class="leaf" title="leaf"></div>
        </div>

        <section class="login-form" aria-labelledby="login-title">
            <h2 id="login-title">Welcome back</h2>
            <p>Sign in to your GreenPoints account and continue earning rewards for proper waste segregation.</p>

            <form id="loginForm" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="email" class="sr-only">Email or Household ID</label>
                    <input id="email" name="email" type="text" class="form-control" placeholder="Email or Household ID" required>
                </div>

                <div class="form-group password-wrap">
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Password" required>
                    <button type="button" class="password-toggle" id="togglePassword">Show</button>
                </div>

                <div class="inline">
                    <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
                    <a href="#" class="forgot">Forgot?</a>
                </div>

                <button type="submit" class="login-btn">Log in</button>

                <div class="login-link">
                    <p class="login-text">Don’t have an account? <a href="register.html">Create one</a></p>
                </div>

                <div class="socials" aria-hidden="true">
                    <button type="button" class="social">Sign in with Google</button>
                    <button type="button" class="social">Sign in with Phone</button>
                </div>
            </form>
        </section>
    </div>
</main>

<footer>
    <p>© 2026 GreenPoints</p>
</footer>

<script>
// Toggle password visibility
const toggle = document.getElementById('togglePassword');
const pwd = document.getElementById('password');
if (toggle && pwd) {
    toggle.addEventListener('click', () => {
        const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
        pwd.setAttribute('type', type);
        toggle.textContent = type === 'password' ? 'Show' : 'Hide';
    });
}

// minimal client-side validation (non-blocking)
const form = document.getElementById('loginForm');
if (form) {
    form.addEventListener('submit', (e) => {
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        if (!email.value.trim() || !password.value.trim()) {
            e.preventDefault();
            alert('Please enter both email/ID and password.');
        }
    });
}
</script>

</body>
</html>
